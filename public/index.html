        // 简化的API配置验证
        function validateApiConfig(config) {
            const errors = [];
            
            // 只验证必要的字段
            if (!config.name || !config.name.trim()) {
                errors.push('API名称不能为空');
            }
            
            if (!config.endpoint || !config.endpoint.trim()) {
                errors.push('API端点不能为空');
            }
            
            if (!config.apiKey || !config.apiKey.trim()) {
                errors.push('API密钥不能为空');
            }
            
            if (!config.modelName || !config.modelName.trim()) {
                errors.push('请选择或输入模型名称');
            }
            
            // URL格式验证
            if (config.endpoint) {
                try {
                    const url = new URL(config.endpoint);
                    if (!['http:', 'https:'].includes(url.protocol)) {
                        errors.push('API端点必须使用http或https协议');
                    }
                } catch (e) {
                    errors.push('API端点URL格式不正确');
                }
            }
            
            if (errors.length > 0) {
                throw new Error(errors.join('；'));
            }
            
            return true;
        }

            if (!config) return;

            state.currentCustomApi = apiName;
            
            // 填充简化的表单
            document.getElementById('customApiName').value = config.name;
            document.getElementById('customApiEndpoint').value = config.endpoint;
            document.getElementById('customApiKey').value = config.apiKey;
            document.getElementById('customModelName').value = config.modelName;
            document.getElementById('customTemperature').value = config.temperature || 0.7;
            document.getElementById('customMaxTokens').value = config.maxTokens || 1500;
        }

        // 更新平台选择器，添加自定义API选项
        function updatePlatformSelectWithCustom() {
            const platformSelect = document.getElementById('platformSelect');
            
            // 保存当前选择
            const currentValue = platformSelect.value;
            
            // 清除现有的自定义API选项
            const customOptions = platformSelect.querySelectorAll('option[data-custom="true"]');
            customOptions.forEach(option => option.remove());
            
            // 添加自定义API选项
            Object.keys(state.customApiConfigs).forEach(apiName => {
                const option = document.createElement('option');
                option.value = `custom_${apiName}`;
                option.textContent = `🔧 ${apiName}`;
                option.dataset.custom = 'true';
                platformSelect.appendChild(option);
            });
            
            // 恢复选择
            if (currentValue === 'custom' && state.currentCustomApi) {
                platformSelect.value = `custom_${state.currentCustomApi}`;
            }
        }

        // 清空自定义API表单
        function clearCustomApiForm() {
            document.getElementById('customApiName').value = '';
            document.getElementById('customApiEndpoint').value = '';
            document.getElementById('customApiKey').value = '';
            document.getElementById('customModelName').value = '';
            document.getElementById('customTemperature').value = '0.7';
            document.getElementById('customMaxTokens').value = '1500';
            document.getElementById('modelList').style.display = 'none';
            document.getElementById('customModelName').innerHTML = '<option value="">请先获取可用模型</option>';
        }

        // 测试自定义API连接 - 简化版
        async function testCustomApi() {
            const endpoint = document.getElementById('customApiEndpoint').value.trim();
            const apiKey = document.getElementById('customApiKey').value.trim();
            const modelName = document.getElementById('customModelName').value.trim();
            const testPrompt = document.getElementById('testPrompt').value.trim();

            // 验证必填字段
            if (!endpoint || !apiKey || !modelName || !testPrompt) {
                showTestResult('请填写所有必填字段', 'error');
                return;
            }

            const testBtn = document.getElementById('testApiBtn');
            const originalText = testBtn.textContent;
            
            try {
                // 禁用按钮并显示加载状态
                testBtn.disabled = true;
                testBtn.textContent = '测试中...';
                showTestResult('正在测试连接...', 'info');

                // 构建简化的请求配置
                const adapter = new CustomApiAdapter({
                    endpoint: endpoint,
                    apiKey: apiKey,
                    modelName: modelName,
                    temperature: parseFloat(document.getElementById('customTemperature').value) || 0.7,
                    maxTokens: parseInt(document.getElementById('customMaxTokens').value) || 1500,
                    timeout: 30
                });

                // 发送测试请求
                const response = await adapter.generateResponse(testPrompt);
                
                // 成功处理
                const successMsg = `✅ 连接成功！\n响应内容：${response.substring(0, 100)}${response.length > 100 ? '...' : ''}`;
                showTestResult(successMsg, 'success');
                
            } catch (error) {
                console.error('[CustomApi] 测试失败:', error);
                handleTestError(error);
            } finally {
                // 恢复按钮状态
                testBtn.disabled = false;
                testBtn.textContent = originalText;
            }
        }

        // 处理测试错误
        function handleTestError(error) {
            const errorMsg = `❌ 连接失败：${error.message}`;
            let suggestions = [];
            
            // 根据错误类型提供建议
            if (error.message.includes('401') || error.message.includes('403')) {
                suggestions = [
                    '检查API密钥是否正确',
                    '确认密钥是否有权限访问此服务'
                ];
            } else if (error.message.includes('404')) {
                suggestions = [
                    '检查API端点URL是否正确',
                    '确认模型名称是否存在'
                ];
            } else if (error.message.includes('CORS')) {
                suggestions = [
                    'API服务需要配置CORS允许跨域请求',
                    '生产环境建议使用后端代理'
                ];
            } else if (error.message.includes('网络') || error.message.includes('Network')) {
                suggestions = [
                    '检查网络连接是否正常',
                    '确认端点URL是否可访问'
                ];
            } else if (error.message.includes('timeout') || error.message.includes('超时')) {
                suggestions = [
                    '检查API服务响应时间',
                    '确认网络连接稳定'
                ];
            } else {
                suggestions = [
                    '检查所有配置项是否正确填写',
                    '尝试使用常见的API端点格式'
                ];
            }
            
            showTestResult(errorMsg, 'error');
            showSuggestions(suggestions);
        }

        // 显示建议列表
        function showSuggestions(suggestions) {
            const suggestionList = document.getElementById('suggestionList');
            suggestionList.innerHTML = suggestions.map(suggestion => 
                `<div class="suggestion-item">${suggestion}</div>`
            ).join('');
        }

        // 显示测试结果
        function showTestResult(message, type) {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = message;
            resultDiv.className = `test-result show ${type}`;
            
            // 清空之前的建议
            document.getElementById('suggestionList').innerHTML = '';
        }

        // 添加开发调试工具（仅在控制台可用）
        if (typeof console !== 'undefined') {
            window.debugWorkflow = {
                getState: () => ({ ...state }),
                getMetrics: () => ({ ...state.performanceMetrics }),
                resetMetrics: () => {
                    state.performanceMetrics = {
                        messageCount: 0,
                        averageResponseTime: 0,
                        errorCount: 0
                    };
                },
                validateApi: (config) => {
                    try {
                        validateApiConfig(config);
                        return { valid: true };
                    } catch (error) {
                        return { valid: false, error: error.message };
                    }
                }
            };
        }

        console.log('✅ AI工作流工作室 v2.2 简化版已加载');
        console.log('🔧 简化功能：自定义API只需API KEY + 自动获取模型');
        console.log('🚀 保留功能：所有原有功能完整保留');
    </script>
</body>
</html>
