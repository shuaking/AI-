services:
  - type: web
    name: ai-workflow-studio
    runtime: node
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: SOCKET_ALLOWED_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /app/server/data
    disk:
      name: workflow-data
      mountPath: /app/server/data
      sizeGB: 1
