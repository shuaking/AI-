services:
  - type: web
    name: ai-workflow-studio
    env: node
    plan: free
    runtime: node
    region: oregon
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: workflow-data
      mountPath: /app/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: SOCKET_ALLOWED_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /app/server/data
      - key: PUBLIC_API_URL
        value: https://your-api.com
      - key: PUBLIC_SOCKET_URL
        value: https://your-api.com
